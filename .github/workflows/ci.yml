name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest
      - run: cd .. && alembic -c alembic.ini check
  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose up -d --build
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/ready && exit 0; sleep 2; done
          docker compose logs
          exit 1
      - name: Verify PostgreSQL migration roundtrip foreign keys
        run: |
          docker compose exec -T api alembic downgrade 20250325_0020
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -c "from sqlalchemy import create_engine, text; import os; engine = create_engine(os.environ['DATABASE_URL']); rows = engine.connect().execute(text(\"SELECT tc.table_name, kcu.column_name, ccu.table_name FROM information_schema.table_constraints tc JOIN information_schema.key_column_usage kcu ON tc.constraint_name = kcu.constraint_name AND tc.table_schema = kcu.table_schema JOIN information_schema.constraint_column_usage ccu ON ccu.constraint_name = tc.constraint_name AND ccu.table_schema = tc.table_schema WHERE tc.constraint_type = 'FOREIGN KEY' AND ((tc.table_name = 'evidence' AND kcu.column_name = 'candidate_id') OR (tc.table_name = 'evidence_candidates' AND kcu.column_name = 'promoted_evidence_id')) ORDER BY tc.table_name\")).all(); assert rows == [('evidence', 'candidate_id', 'evidence_candidates')], rows"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: cd web && CI_API_REQUIRED=1 API_URL=http://localhost:8000 npx playwright test
      - if: always()
        run: docker compose logs && docker compose down -v
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
