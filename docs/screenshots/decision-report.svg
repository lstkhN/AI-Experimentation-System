<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title"><title id="title">Decision report preview</title><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#28489d"/><stop offset="1" stop-color="#6d8cff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#1a3151" flood-opacity=".1"/></filter></defs><rect width="1400" height="820" rx="22" fill="#edf2ff"/><rect x="190" y="40" width="1020" height="740" rx="10" fill="#fff" filter="url(#s)"/><rect x="190" y="40" width="1020" height="180" rx="10" fill="url(#g)"/><circle cx="260" cy="110" r="35" fill="#fff" fill-opacity=".18"/><path d="m260 76 10 29 24 10-24 10-10 29-10-29-24-10 24-10z" fill="#fff"/><text x="330" y="103" font-family="system-ui" font-size="16" font-weight="800" letter-spacing="2" fill="#dce7ff">DECISION REPORT</text><text x="330" y="153" font-family="system-ui" font-size="34" font-weight="800" fill="#fff">Is the idea worth testing?</text><rect x="330" y="172" width="130" height="30" rx="15" fill="#dff4e7"/><text x="354" y="192" font-family="system-ui" font-size="13" font-weight="800" fill="#14663b">PROMISING</text><text x="235" y="275" font-family="system-ui" font-size="21" font-weight="800" fill="#172033">Executive summary</text><text x="235" y="310" font-family="system-ui" font-size="16" fill="#647086">A concise, evidence-backed view of the opportunity, risks and next move.</text><rect x="235" y="350" width="285" height="160" rx="10" fill="#f7f9ff" stroke="#dce3ef"/><text x="260" y="386" font-family="system-ui" font-size="13" font-weight="800" fill="#5367a5">SUCCESS CONDITIONS</text><text x="260" y="425" font-family="system-ui" font-size="15" fill="#43516a">• Paid conversion above 8%</text><text x="260" y="454" font-family="system-ui" font-size="15" fill="#43516a">• CAC below €120</text><text x="260" y="483" font-family="system-ui" font-size="15" fill="#43516a">• Churn below 4%</text><rect x="550" y="350" width="285" height="160" rx="10" fill="#fff9f5" stroke="#f0dfd1"/><text x="575" y="386" font-family="system-ui" font-size="13" font-weight="800" fill="#9b5a31">KILL GATES</text><text x="575" y="425" font-family="system-ui" font-size="15" fill="#60422f">• No paid pilot in 30 days</text><text x="575" y="454" font-family="system-ui" font-size="15" fill="#60422f">• LTV/CAC below 1.5x</text><text x="575" y="483" font-family="system-ui" font-size="15" fill="#60422f">• Buyer remains unknown</text><rect x="865" y="350" width="285" height="160" rx="10" fill="#f6fbf8" stroke="#d8ebdf"/><text x="890" y="386" font-family="system-ui" font-size="13" font-weight="800" fill="#14663b">NEXT EXPERIMENT</text><text x="890" y="425" font-family="system-ui" font-size="15" fill="#43516a">Paid landing page</text><text x="890" y="454" font-family="system-ui" font-size="15" fill="#43516a">n = 100 visitors</text><text x="890" y="483" font-family="system-ui" font-size="15" fill="#43516a">Pass: ≥ 8% signup</text><text x="235" y="585" font-family="system-ui" font-size="21" font-weight="800" fill="#172033">Evidence ledger</text><line x1="235" y1="615" x2="1160" y2="615" stroke="#dce3ef"/><circle cx="250" cy="655" r="8" fill="#2f9a61"/><text x="275" y="661" font-family="system-ui" font-size="15" fill="#43516a">3 supporting sources</text><circle cx="505" cy="655" r="8" fill="#e3a32a"/><text x="530" y="661" font-family="system-ui" font-size="15" fill="#43516a">2 unknowns</text><circle cx="750" cy="655" r="8" fill="#d15b5b"/><text x="775" y="661" font-family="system-ui" font-size="15" fill="#43516a">1 contradiction</text><rect x="235" y="705" width="925" height="1" fill="#e5eaf2"/><text x="235" y="742" font-family="system-ui" font-size="14" fill="#647086">Export as Markdown · HTML · JSON</text></svg>
